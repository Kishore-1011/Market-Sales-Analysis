name: Notebook

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the notebook from top to bottom
        run: jupyter nbconvert --to notebook --execute notebooks/01_market_sales_exploration.ipynb --output-dir "$RUNNER_TEMP"
