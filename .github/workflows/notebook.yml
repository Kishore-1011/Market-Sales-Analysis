name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the tests
        run: pytest

      - name: Clean the data, run the tests and draw the charts
        run: |
          python -m market_sales.clean
          python -m market_sales.stats
          python -m market_sales.charts

      - name: Run the notebooks from top to bottom
        run: |
          jupyter nbconvert --to notebook --execute notebooks/01_market_sales_exploration.ipynb --output-dir "$RUNNER_TEMP"
          jupyter nbconvert --to notebook --execute notebooks/02_data_cleaning.ipynb --output-dir "$RUNNER_TEMP"
          jupyter nbconvert --to notebook --execute notebooks/03_sales_analysis.ipynb --output-dir "$RUNNER_TEMP"
          jupyter nbconvert --to notebook --execute notebooks/04_testing_findings.ipynb --output-dir "$RUNNER_TEMP"
